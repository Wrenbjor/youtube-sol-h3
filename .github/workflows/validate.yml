name: Validate skill package

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate marketplace package
        run: python scripts/validate_package.py
      - name: Check episode planning invariants
        run: python plugins/youtube-sol-h3/skills/youtube-sol-h3/scripts/test_validate_plan.py
